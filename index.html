<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE 100 · 影响人类历史进程的100名人</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson@3"></script>
<script src="data.js"></script>
<script src="content.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d1117;
  color: #e6edf3;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
#header {
  flex: 0 0 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: linear-gradient(90deg, #161b22 0%, #1a2035 100%);
  border-bottom: 1px solid #30363d;
  z-index: 10;
}
#header h1 { font-size: 16px; font-weight: 600; letter-spacing: 2px; color: #f0d080; }
#header .subtitle { font-size: 11px; color: #8b949e; margin-left: 12px; }
.legend { display: flex; gap: 10px; align-items: center; }
.legend-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px; color: #8b949e; cursor: pointer; transition: color .2s;
}
.legend-item:hover { color: #e6edf3; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; }

/* ── Map ── */
#map-container {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
#map-svg { width: 100%; height: 100%; display: block; cursor: grab; }
#map-svg:active { cursor: grabbing; }

.country { fill: #1e2840; stroke: #2d3a52; stroke-width: 0.4; }
.graticule { fill: none; stroke: #1a2235; stroke-width: 0.3; }
.sphere { fill: #0a1628; }
.person-dot { cursor: pointer; transition: opacity .2s; }
.person-dot:hover { opacity: 1 !important; }
.person-label { font-size: 7px; pointer-events: none; fill: #0d1117; font-weight: 700;
  text-anchor: middle; dominant-baseline: middle; }

/* Map fit buttons */
#map-fit-btns {
  position: absolute;
  bottom: 12px; right: 12px;
  display: flex; gap: 4px;
  z-index: 20;
}
.fit-btn {
  background: #161b22cc;
  border: 1px solid #30363d;
  border-radius: 5px;
  color: #8b949e;
  font-size: 10px;
  padding: 4px 8px;
  cursor: pointer;
  backdrop-filter: blur(4px);
  transition: background .15s, color .15s, border-color .15s;
  font-family: inherit;
}
.fit-btn:hover { background: #21262d; color: #e6edf3; }
.fit-btn.active { background: #1f3a5f; border-color: #4a90d9; color: #79c0ff; }

/* ── Timeline ── */
#timeline {
  flex: 0 0 auto;
  background: #161b22;
  border-top: 1px solid #30363d;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: height .3s ease;
}
#tl-controls {
  flex: 0 0 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-bottom: 1px solid #21262d;
  background: #161b22;
}
#era-buttons { display: flex; gap: 3px; }
.era-btn {
  background: transparent;
  border: 1px solid #30363d;
  border-radius: 4px;
  color: #6e7681;
  font-size: 10px;
  padding: 3px 8px;
  cursor: pointer;
  font-family: inherit;
  transition: background .15s, color .15s, border-color .15s;
  white-space: nowrap;
}
.era-btn:hover { background: #21262d; color: #cdd9e5; }
.era-btn.active { background: #1f3a5f; border-color: #4a90d9; color: #79c0ff; }

#yr-range {
  display: none;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: #8b949e;
}
#yr-range input {
  width: 60px; padding: 2px 5px;
  background: #0d1117; border: 1px solid #30363d;
  border-radius: 4px; color: #cdd9e5; font-size: 10px;
  font-family: inherit;
}
#yr-range input:focus { outline: none; border-color: #4a90d9; }
#yr-apply {
  background: #1f3a5f; border: 1px solid #4a90d9;
  border-radius: 4px; color: #79c0ff; font-size: 10px;
  padding: 2px 7px; cursor: pointer; font-family: inherit;
}
#yr-apply:hover { background: #2d4e7f; }

#tl-mode-info {
  margin-left: auto;
  font-size: 9px;
  color: #3d4d60;
}

#tl-svg-wrap {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
}
#tl-svg-wrap::-webkit-scrollbar { width: 4px; }
#tl-svg-wrap::-webkit-scrollbar-track { background: transparent; }
#tl-svg-wrap::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
#timeline-svg { display: block; width: 100%; }

.tl-dot { cursor: pointer; }
.tl-dot:hover { opacity: 1 !important; }
.tl-bar { cursor: pointer; rx: 2; }
.tl-bar:hover { opacity: 1 !important; }

/* ── Detail Panel ── */
#detail-panel {
  position: fixed;
  top: 48px; right: -420px; width: 400px; bottom: 0;
  background: #161b22;
  border-left: 1px solid #30363d;
  display: flex; flex-direction: column;
  transition: right .35s cubic-bezier(.4,0,.2,1);
  z-index: 100;
  box-shadow: -8px 0 32px rgba(0,0,0,.5);
}
#detail-panel.open { right: 0; }
#detail-header { padding: 20px 20px 12px; border-bottom: 1px solid #30363d; flex: 0 0 auto; }
#detail-rank { font-size: 11px; color: #f0d080; letter-spacing: 1px; margin-bottom: 4px; }
#detail-name-zh { font-size: 22px; font-weight: 700; }
#detail-name-en { font-size: 14px; color: #8b949e; margin-top: 2px; }
#detail-dates   { font-size: 12px; color: #8b949e; margin-top: 6px; }
#detail-region  { display: inline-block; margin-top: 8px; padding: 2px 10px;
  border-radius: 12px; font-size: 11px; font-weight: 500; }
#detail-body {
  flex: 1 1 auto; overflow-y: auto; padding: 16px 20px; scroll-behavior: smooth;
}
#detail-body::-webkit-scrollbar { width: 4px; }
#detail-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
.para-block { margin-bottom: 16px; }
.para-en { font-size: 12px; line-height: 1.7; color: #8b949e; }
.para-zh { font-size: 13px; line-height: 1.8; color: #cdd9e5; margin-top: 6px; }
.para-divider { border: none; border-top: 1px solid #21262d; margin: 12px 0; }
#detail-links { padding: 12px 20px; border-top: 1px solid #30363d; flex: 0 0 auto; }
#detail-links a {
  display: inline-block; margin-right: 8px; margin-bottom: 4px;
  padding: 4px 10px; background: #1e2840; border: 1px solid #30363d;
  border-radius: 6px; color: #79c0ff; font-size: 11px; text-decoration: none;
  transition: background .15s;
}
#detail-links a:hover { background: #2d3a52; }
#close-btn {
  position: absolute; top: 14px; right: 14px;
  background: none; border: none; color: #8b949e; cursor: pointer;
  font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 4px;
}
#close-btn:hover { background: #21262d; color: #e6edf3; }

/* ── Tooltip ── */
#tooltip {
  position: fixed;
  background: #1e2840ee; border: 1px solid #30363d; border-radius: 8px;
  padding: 8px 12px; pointer-events: none; font-size: 12px; line-height: 1.5;
  z-index: 200; display: none; max-width: 200px;
}
#tooltip .tt-rank { color: #f0d080; font-size: 10px; }
#tooltip .tt-zh   { font-size: 14px; font-weight: 600; }
#tooltip .tt-en   { color: #8b949e; font-size: 11px; }
#tooltip .tt-date { color: #8b949e; font-size: 10px; }

/* ── Map filter overlay ── */
#map-filters {
  position: absolute;
  top: 10px; left: 10px;
  display: flex; flex-direction: column; gap: 4px;
  z-index: 20;
}
.filter-row { display: flex; gap: 3px; align-items: center; }
.filter-label { font-size: 9px; color: #4a5570; min-width: 24px; }
.filter-btn {
  background: #161b22cc; border: 1px solid #2d3a52;
  border-radius: 4px; color: #6e7681; font-size: 10px;
  padding: 3px 8px; cursor: pointer; font-family: inherit;
  backdrop-filter: blur(4px);
  transition: background .15s, color .15s, border-color .15s;
}
.filter-btn:hover { background: #21262d; color: #cdd9e5; }
.filter-btn.active { background: rgba(79,139,224,0.2); border-color: #4a90d9; color: #79c0ff; }
.filter-btn[data-value="Nature"].active  { background: rgba(82,168,224,0.2); border-color: #52a8e0; color: #52a8e0; }
.filter-btn[data-value="Spirit"].active  { background: rgba(224,168,64,0.2);  border-color: #e0a840; color: #e0a840; }
.filter-btn[data-value="Society"].active { background: rgba(224,82,112,0.2);  border-color: #e05270; color: #e05270; }

/* ── Region filter (header right) ── */
#region-filter { position: relative; display: flex; align-items: center; }
#region-filter-btn {
  display: flex; align-items: center; gap: 6px;
  background: #161b22cc; border: 1px solid #30363d; border-radius: 6px;
  color: #8b949e; font-size: 11px; padding: 5px 10px; cursor: pointer;
  font-family: inherit; backdrop-filter: blur(4px);
  transition: background .15s, color .15s, border-color .15s;
}
#region-filter-btn:hover { background: #21262d; color: #cdd9e5; }
#region-filter-btn.has-selection { border-color: #4a90d9; color: #79c0ff; }
.count-badge {
  background: #1f3a5f; color: #79c0ff; border-radius: 10px;
  padding: 1px 7px; font-size: 10px; font-weight: 600; min-width: 22px;
  text-align: center; transition: background .2s;
}

#region-dropdown {
  position: absolute; top: 100%; right: 0; margin-top: 6px;
  background: #161b22ee; border: 1px solid #30363d; border-radius: 8px;
  min-width: 210px; max-height: 420px; overflow-y: auto;
  backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0,0,0,.6);
  z-index: 50; padding: 6px 0; display: flex; flex-direction: column;
}
#region-dropdown::-webkit-scrollbar { width: 3px; }
#region-dropdown::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
#region-dropdown.hidden { display: none; }

.reg-item {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 12px; cursor: pointer; transition: background .12s;
  font-size: 12px; color: #cdd9e5; user-select: none;
}
.reg-item:hover { background: #21262d; }
.reg-item input[type="checkbox"] {
  accent-color: #4a90d9; width: 13px; height: 13px; cursor: pointer; flex-shrink: 0;
}
.reg-item-all {
  border-bottom: 1px solid #21262d; padding-bottom: 7px; margin-bottom: 2px;
  font-weight: 600; color: #e6edf3;
}
.reg-continent {
  font-weight: 600; font-size: 12px; padding: 6px 12px 3px;
  color: #8b949e; margin-top: 2px;
}
.reg-continent input { accent-color: #6e7681; }
.reg-sub {
  padding: 4px 12px 4px 32px; font-size: 11px;
}
.reg-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}

/* ── Map country emphasis ── */
.country { transition: fill .5s ease, opacity .5s ease; }

/* ── Detail portrait ── */
#detail-portrait {
  width: 64px; height: 64px; border-radius: 8px; overflow: hidden;
  flex: 0 0 64px; background: #0d1117;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid #30363d;
}
#detail-portrait img { width: 100%; height: 100%; object-fit: cover; }
#detail-portrait .avatar-fallback {
  font-size: 22px; font-weight: 700; color: #fff; opacity: 0.7;
}
#detail-header-top {
  display: flex; gap: 14px; align-items: flex-start;
}
#detail-header-text { flex: 1 1 auto; min-width: 0; }

/* ── Tag pills ── */
.tag-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.tag-pill {
  padding: 2px 8px; border-radius: 10px; font-size: 10px;
  background: #1e2840; border: 1px solid #30363d; color: #8b949e;
}
.tag-pill.domain-Nature  { border-color: #52a8e044; color: #52a8e0; background: rgba(82,168,224,0.08); }
.tag-pill.domain-Spirit  { border-color: #e0a84044; color: #e0a840; background: rgba(224,168,64,0.08); }
.tag-pill.domain-Society { border-color: #e0527044; color: #e05270; background: rgba(224,82,112,0.08); }

/* ── Loading ── */
#loading {
  position: fixed; inset: 0; background: #0d1117;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px; z-index: 999;
  font-size: 14px; color: #8b949e;
}
.spinner {
  width: 32px; height: 32px; border: 3px solid #30363d;
  border-top-color: #f0d080; border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><span>载入地图中…</span></div>

<div id="header">
  <div style="display:flex;align-items:baseline;gap:8px">
    <h1>THE 100</h1>
    <span class="subtitle">影响人类历史进程的100名人排行榜</span>
  </div>
  <div id="region-filter">
    <button id="region-filter-btn">
      <span>🌍 地区</span>
      <span id="region-filter-count" class="count-badge">全部</span>
    </button>
    <div id="region-dropdown" class="hidden"></div>
  </div>
</div>

<div id="map-container">
  <svg id="map-svg"></svg>

  <!-- Domain filter overlay -->
  <div id="map-filters">
    <div class="filter-row">
      <span class="filter-label">领域</span>
      <button class="filter-btn active" data-filter="domain" data-value="all">全部</button>
      <button class="filter-btn" data-filter="domain" data-value="Nature">自然·科学</button>
      <button class="filter-btn" data-filter="domain" data-value="Spirit">思想·文化</button>
      <button class="filter-btn" data-filter="domain" data-value="Society">政治·社会</button>
    </div>
  </div>

  <div id="map-fit-btns">
    <button class="fit-btn active" data-mode="auto" title="自适应（保持全图）">自适应</button>
    <button class="fit-btn" data-mode="width" title="横向铺满">横向</button>
    <button class="fit-btn" data-mode="height" title="纵向铺满">纵向</button>
  </div>
</div>

<div id="timeline">
  <div id="tl-controls">
    <div id="era-buttons">
      <button class="era-btn active" data-era="all">全部</button>
      <button class="era-btn" data-era="ancient">上古</button>
      <button class="era-btn" data-era="classical">古典</button>
      <button class="era-btn" data-era="medieval">中世纪</button>
      <button class="era-btn" data-era="earlymod">近代</button>
      <button class="era-btn" data-era="modern">现代</button>
    </div>
    <div id="yr-range">
      <input type="number" id="yr-start" step="10">
      <span style="color:#3d4d60">—</span>
      <input type="number" id="yr-end" step="10">
      <button id="yr-apply">确定</button>
    </div>
    <span id="tl-mode-info"></span>
  </div>
  <div id="tl-svg-wrap">
    <svg id="timeline-svg"></svg>
  </div>
</div>

<div id="detail-panel">
  <button id="close-btn">✕</button>
  <div id="detail-header">
    <div id="detail-header-top">
      <div id="detail-portrait"><span class="avatar-fallback" id="detail-avatar"></span></div>
      <div id="detail-header-text">
        <div id="detail-rank"></div>
        <div id="detail-name-zh"></div>
        <div id="detail-name-en"></div>
        <div id="detail-dates"></div>
      </div>
    </div>
    <div id="detail-tags" class="tag-pills" style="margin-top:10px"></div>
  </div>
  <div id="detail-body"></div>
  <div id="detail-links"></div>
</div>

<div id="tooltip"></div>

<script>
// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════

const ERA_DEFS = {
  all:      { start: -3200, end: 2030, label: '全部',   fineTune: false },
  ancient:  { start: -3200, end: -500, label: '上古',   fineTune: false },
  classical:{ start: -500,  end: 500,  label: '古典',   fineTune: false },
  medieval: { start: 500,   end: 1400, label: '中世纪', fineTune: true  },
  earlymod: { start: 1400,  end: 1800, label: '近代',   fineTune: true  },
  modern:   { start: 1800,  end: 2030, label: '现代',   fineTune: true  },
};

// Range threshold: <= this many years → lifeline mode
const LIFELINE_THRESHOLD = 600;

// ═══════════════════════════════════════════════════════════════
// ISO 3166-1 numeric → alpha-2 (for countries-110m.json)
// ═══════════════════════════════════════════════════════════════
const ISO_NUM_TO_A2 = {
"4":"AF","8":"AL","12":"DZ","20":"AD","24":"AO","28":"AG","31":"AZ","32":"AR","36":"AU",
"40":"AT","44":"BS","48":"BH","50":"BD","51":"AM","52":"BB","56":"BE","60":"BM","64":"BT",
"68":"BO","70":"BA","72":"BW","76":"BR","84":"BZ","90":"SB","96":"BN","100":"BG","104":"MM",
"108":"BI","112":"BY","116":"KH","120":"CM","124":"CA","132":"CV","140":"CF","144":"LK",
"148":"TD","152":"CL","156":"CN","158":"TW","162":"CX","166":"CC","170":"CO","174":"KM",
"175":"YT","178":"CG","180":"CD","184":"CK","188":"CR","191":"HR","192":"CU","196":"CY",
"203":"CZ","204":"BJ","208":"DK","212":"DM","214":"DO","218":"EC","222":"SV","226":"GQ",
"231":"ET","232":"ER","233":"EE","234":"FO","238":"FK","239":"GS","242":"FJ","246":"FI",
"248":"AX","250":"FR","254":"GF","258":"PF","260":"TF","262":"DJ","266":"GA","268":"GE",
"270":"GM","275":"PS","276":"DE","288":"GH","292":"GI","296":"KI","300":"GR","304":"GL",
"308":"GD","312":"GP","316":"GU","320":"GT","324":"GN","328":"GY","332":"HT","334":"HM",
"336":"VA","340":"HN","344":"HK","348":"HU","352":"IS","356":"IN","360":"ID","364":"IR",
"368":"IQ","372":"IE","376":"IL","380":"IT","384":"CI","388":"JM","392":"JP","398":"KZ",
"400":"JO","404":"KE","408":"KP","410":"KR","414":"KW","417":"KG","418":"LA","422":"LB",
"426":"LS","428":"LV","430":"LR","434":"LY","438":"LI","440":"LT","442":"LU","446":"MO",
"450":"MG","454":"MW","458":"MY","462":"MV","466":"ML","470":"MT","474":"MQ","478":"MR",
"480":"MU","484":"MX","492":"MC","496":"MN","498":"MD","499":"ME","500":"MS","504":"MA",

"624":"GW","626":"TL","630":"PR","634":"QA","638":"RE","642":"RO","643":"RU","646":"RW",

"678":"ST","682":"SA","686":"SN","688":"RS","690":"SC","694":"SL","702":"SG","703":"SK",
"704":"VN","705":"SI","706":"SO","710":"ZA","716":"ZW","724":"ES","728":"SS","729":"SD",
"732":"EH","740":"SR","748":"SZ","752":"SE","756":"CH","760":"SY","762":"TJ","764":"TH",
"768":"TG","772":"TK","776":"TO","780":"TT","784":"AE","788":"TN","792":"TR","795":"TM",
"798":"TV","800":"UG","804":"UA","807":"MK","818":"EG","826":"GB","831":"GG","832":"JE",
"833":"IM","834":"TZ","840":"US","850":"VI","854":"BF","858":"UY","860":"UZ","862":"VE",
"882":"WS","887":"YE","894":"ZM",
};

// ═══════════════════════════════════════════════════════════════
// REGION HIERARCHY (continent → subregions)
// ═══════════════════════════════════════════════════════════════

const CONT_TO_SUBS = {};
for (const [subKey, sub] of Object.entries(SUBREGIONS)) {
  if (!CONT_TO_SUBS[sub.continent]) CONT_TO_SUBS[sub.continent] = [];
  CONT_TO_SUBS[sub.continent].push(subKey);
}
for (const contKey of Object.keys(CONTINENTS)) {
  if (!CONT_TO_SUBS[contKey]) CONT_TO_SUBS[contKey] = [];
}

const CONT_ORDER = ['亚洲','欧洲','非洲','北美洲','拉丁美洲','大洋洲'];

const SUB_TO_CONT = {};
for (const [subKey, sub] of Object.entries(SUBREGIONS)) {
  SUB_TO_CONT[subKey] = sub.continent;
}
for (const contKey of Object.keys(CONTINENTS)) {
  if (!SUB_TO_CONT[contKey]) SUB_TO_CONT[contKey] = contKey;
}

// Resolve a region color for a subregion/continent key, staying within the
// region's own color family. COUNTRIES + REGIONS in data.js are complete, so
// every selectable region has a color here.
function regionColor(sr, ct) {
  const reg = REGIONS[sr] || REGIONS[ct];
  return reg ? reg.color : '#4a90d9';
}

// ═══════════════════════════════════════════════════════════════
// REGION FILTER STATE
// ═══════════════════════════════════════════════════════════════

const regionState = {
  selectedSubs: new Set(),
  mode: 'all',
};

function activeSubregions() {
  if (regionState.mode === 'all') return null;
  return new Set(regionState.selectedSubs);
}

// Timeline heights

function formatYear(y) {
  return y < 0 ? `前 ${Math.abs(y)} 年` : `${y} 年`;
}
function yearLabel(p) {
  return `${formatYear(p.birth)} — ${formatYear(p.death)}`;
}
function dotR(d) {
  if (d.rank <= 5)  return 9;
  if (d.rank <= 20) return 7;
  if (d.rank <= 50) return 5.5;
  return 4.5;
}

const tooltip = document.getElementById('tooltip');

function showTooltip(evt, d) {
  const reg = REGIONS[d.region];
  const roleZh = (ROLE_LABELS && d.role) ? (ROLE_LABELS[d.role] || d.role) : '';
  const domainInfo = (DOMAIN_LABELS && d.domain) ? DOMAIN_LABELS[d.domain] : null;
  tooltip.innerHTML = `
    <div class="tt-rank">排名 #${d.rank}</div>
    <div class="tt-zh">${d.zh}</div>
    <div class="tt-en">${d.en}</div>
    <div class="tt-date">${yearLabel(d)}</div>
    <div style="margin-top:4px;display:flex;gap:6px;align-items:center">
      <span style="font-size:10px;color:${reg.color}">${reg.label}</span>
      ${domainInfo ? `<span style="font-size:10px;color:${domainInfo.color}">${roleZh}</span>` : ''}
    </div>`;
  tooltip.style.display = 'block';
  moveTip(evt);
}
function moveTip(evt) {
  const x = evt.clientX, y = evt.clientY, tw = 200;
  tooltip.style.left = (x + 14 + tw > window.innerWidth ? x - tw - 8 : x + 14) + 'px';
  tooltip.style.top  = (y - 20 < 0 ? y + 8 : y - 20) + 'px';
}
function hideTip() { tooltip.style.display = 'none'; }

function parseMD(text) {
  if (!text) return null;
  // Strip YAML frontmatter if present (defensive)
  const noFront = text.replace(/^---[\s\S]*?---\n/, '');
  // Split on --- separators between paragraph groups
  const parts = noFront.split(/\n---\n/).map(s => s.trim()).filter(Boolean);
  // Filter out headings (# or ##, some files use single #)
  const blocks = parts.filter(p => !/^#{1,2}\s/.test(p));
  // Flatten: split each block on blank lines into individual text segments
  const segments = [];
  for (const block of blocks) {
    const segs = block.split(/\n\n/).map(s => s.trim()).filter(Boolean);
    for (const s of segs) segments.push(s);
  }
  // Classify a segment as primarily Chinese (CJK char count > Latin char count)
  function isPrimarilyChinese(s) {
    const cjk = (s.match(/[一-鿿㐀-䶿]/g) || []).length;
    const lat = (s.match(/[a-zA-Z]/g) || []).length;
    return cjk > lat;
  }
  // Pair by language alternation: EN → ZH → EN → ZH …
  const pairs = [];
  let i = 0;
  while (i < segments.length) {
    const cur = segments[i];
    if (!isPrimarilyChinese(cur)) {
      // English segment — look ahead one for its Chinese counterpart
      const next = segments[i + 1];
      if (next && isPrimarilyChinese(next)) {
        pairs.push({ en: cur, zh: next });
        i += 2;
      } else {
        pairs.push({ en: cur, zh: '' });
        i += 1;
      }
    } else {
      // Chinese segment — try to attach to previous pair missing ZH
      if (pairs.length > 0 && !pairs[pairs.length - 1].zh) {
        pairs[pairs.length - 1].zh = cur;
      } else {
        pairs.push({ en: '', zh: cur });
      }
      i += 1;
    }
  }
  return pairs.filter(p => p.en || p.zh);
}

document.getElementById('close-btn').addEventListener('click', closeDetail);

function renderRegionDropdown() {
  const dd = document.getElementById('region-dropdown');
  const activeSubs = regionState.selectedSubs;
  const hasSelection = regionState.mode !== 'all';

  let html = `<label class="reg-item reg-item-all">
    <input type="checkbox" ${!hasSelection ? 'checked' : ''} data-action="all">
    <span>全部地区</span>
  </label>`;

  for (const cont of CONT_ORDER) {
    const subs = CONT_TO_SUBS[cont] || [];
    const allSubsSelected = subs.length > 0 && subs.every(s => activeSubs.has(s));
    const someSelected = subs.some(s => activeSubs.has(s));
    const contSelected = subs.length === 0 ? activeSubs.has(cont) : allSubsSelected;

    html += `<div class="reg-item reg-continent">
      <input type="checkbox" ${contSelected ? 'checked' : ''}
        ${someSelected && !allSubsSelected ? 'class="partial"' : ''}
        data-action="continent" data-cont="${cont}">
      <span>${cont}</span>
    </div>`;

    for (const sub of subs) {
      const reg = REGIONS[sub] || REGIONS[cont] || { color: '#888' };
      const sel = activeSubs.has(sub);
      html += `<label class="reg-item reg-sub">
        <input type="checkbox" ${sel ? 'checked' : ''} data-action="sub" data-sub="${sub}">
        <span class="reg-dot" style="background:${reg.color}"></span>
        <span>${sub}</span>
      </label>`;
    }
  }

  dd.innerHTML = html;
  // Set indeterminate state on continent checkboxes for partial selection
  dd.querySelectorAll('.reg-continent input').forEach(inp => {
    const cont = inp.dataset.cont;
    const subs = CONT_TO_SUBS[cont] || [];
    if (subs.length > 0) {
      const some = subs.some(s => activeSubs.has(s));
      const all = subs.every(s => activeSubs.has(s));
      inp.indeterminate = some && !all;
    }
  });
  updateRegionBadge();
}

function updateRegionBadge() {
  const btn = document.getElementById('region-filter-btn');
  const badge = document.getElementById('region-filter-count');
  if (regionState.mode === 'all') {
    badge.textContent = '全部';
    btn.classList.remove('has-selection');
  } else {
    const n = regionState.selectedSubs.size;
    badge.textContent = n;
    btn.classList.add('has-selection');
  }
}

function initRegionFilter() {
  const btn = document.getElementById('region-filter-btn');
  const dd = document.getElementById('region-dropdown');

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    dd.classList.toggle('hidden');
    if (!dd.classList.contains('hidden')) renderRegionDropdown();
  });

  dd.addEventListener('click', (e) => {
    const inp = e.target.closest('input[type="checkbox"]');
    if (!inp) return;
    const action = inp.dataset.action;

    if (action === 'all') {
      regionState.selectedSubs.clear();
      regionState.mode = 'all';
    } else if (action === 'continent') {
      const cont = inp.dataset.cont;
      const subs = CONT_TO_SUBS[cont] || [];
      if (subs.length === 0) {
        // Continent with no subregions — toggle the continent itself
        if (regionState.selectedSubs.has(cont)) {
          regionState.selectedSubs.delete(cont);
        } else {
          regionState.selectedSubs.add(cont);
        }
      } else {
        const allSel = subs.every(s => regionState.selectedSubs.has(s));
        if (allSel) {
          for (const s of subs) regionState.selectedSubs.delete(s);
        } else {
          for (const s of subs) regionState.selectedSubs.add(s);
        }
      }
      regionState.mode = regionState.selectedSubs.size > 0 ? 'partial' : 'all';
    } else if (action === 'sub') {
      const sub = inp.dataset.sub;
      if (regionState.selectedSubs.has(sub)) {
        regionState.selectedSubs.delete(sub);
      } else {
        regionState.selectedSubs.add(sub);
      }
      regionState.mode = regionState.selectedSubs.size > 0 ? 'partial' : 'all';
    }

    applyRegionEmphasis();
    renderRegionDropdown();
  });

  document.addEventListener('click', (e) => {
    if (!document.getElementById('region-filter').contains(e.target)) {
      dd.classList.add('hidden');
    }
  });
}

// ═══════════════════════════════════════════════════════════
// MAP
// ═══════════════════════════════════════════════════════════

const PANEL_W = 400;                 // detail panel width (matches CSS)
const MAP_W_K = 0.175, MAP_H_K = 0.318;  // Natural Earth 1: scale↔dimension ratios

function getMapDims() {
  const el = document.getElementById('map-svg');
  return { W: el.clientWidth || window.innerWidth, H: el.clientHeight || 400 };
}

function computeScale(mode, W, H) {
  // scale/width ≈ MAP_W_K, scale/height ≈ MAP_H_K
  if (mode === 'width')  return W * MAP_W_K;
  if (mode === 'height') return H * MAP_H_K;
  return Math.min(W * MAP_W_K, H * MAP_H_K);  // auto: fit all
}

// Content size (px) the projected map occupies at a given scale.
function mapContentSize(scale) {
  return { mw: scale / MAP_W_K, mh: scale / MAP_H_K };
}

// Clamp pan so the map can't be dragged/scrolled past its own edges.
// availW = horizontal space available to the map (viewport minus open panel).
function clampPan(scale, availW, H) {
  const { mw, mh } = mapContentSize(scale);
  const overX = (mw - availW) / 2;
  const overY = (mh - H) / 2;
  userPanX = overX > 0 ? Math.max(-overX, Math.min(overX, userPanX)) : 0;
  userPanY = overY > 0 ? Math.max(-overY, Math.min(overY, userPanY)) : 0;
}

function redrawMap() {
  if (!worldData || !projection) return;
  const { W, H } = getMapDims();

  // Panel-aware layout: when the detail panel is open, the map fits into and
  // centers within the remaining space to the left of the panel.
  const panelEl = document.getElementById('detail-panel');
  const panelOpen = panelEl && panelEl.classList.contains('open');
  const availW = W - (panelOpen ? PANEL_W : 0);

  const baseScale = computeScale(fitMode, availW, H);
  const zk = fitMode === 'auto' ? userZoom : 1;
  const scale = baseScale * zk;

  clampPan(scale, availW, H);
  const tx = availW / 2 + userPanX;
  const ty = H / 2 + userPanY;

  projection.scale(scale).translate([tx, ty]);
  geoPath = d3.geoPath().projection(projection);

  mapSvg.select('.sphere').attr('d', geoPath({ type: 'Sphere' }));
  mapSvg.select('.graticule').attr('d', geoPath(d3.geoGraticule()()));
  mapSvg.selectAll('.country').attr('d', geoPath);

  // Reproject persons
  PERSONS.forEach(d => {
    const pt = projection([d.birth_lng, d.birth_lat]);
    d._x = pt ? pt[0] : null;
    d._y = pt ? pt[1] : null;
  });
  mapSvg.selectAll('.person-dot')
    .attr('cx', d => d._x)
    .attr('cy', d => d._y)
    .attr('visibility', d => d._x ? 'visible' : 'hidden');
  mapSvg.selectAll('.person-label')
    .attr('x', d => d._x)
    .attr('y', d => d._y);
}

// ── Map interaction: wheel zoom + drag pan ──────────────────
function setupMapInteraction(svgEl) {
  let dragging = false, dragSX = 0, dragSY = 0, startPX = 0, startPY = 0;

  svgEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const { W, H } = getMapDims();
    const panelOpen = document.getElementById('detail-panel').classList.contains('open');
    const availW = W - (panelOpen ? PANEL_W : 0);

    if (fitMode === 'auto') {
      // Auto: wheel zooms toward the cursor (floor = original size).
      const delta = e.deltaY > 0 ? 0.88 : 1.14;
      const newZ = Math.max(1, Math.min(8, userZoom * delta));
      if (newZ === userZoom) return;

      const rect = svgEl.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const cx = availW / 2, cy = H / 2;
      const ratio = newZ / userZoom;
      // Keep the geographic point under the cursor fixed.
      userPanX = mx - (mx - cx - userPanX) * ratio - cx;
      userPanY = my - (my - cy - userPanY) * ratio - cy;
      userZoom = newZ;
    } else {
      // Width/height fill: wheel scrolls along the overflowing axis so the
      // clipped portion of the map can be reached. clampPan() bounds it.
      if (fitMode === 'width') userPanY -= e.deltaY;
      else                     userPanX -= e.deltaY;
    }
    redrawMap();
  }, { passive: false });

  svgEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    dragSX = e.clientX; dragSY = e.clientY;
    startPX = userPanX; startPY = userPanY;
    svgEl.style.cursor = 'grabbing';
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    userPanX = startPX + (e.clientX - dragSX);
    userPanY = startPY + (e.clientY - dragSY);
    redrawMap();
  });

  window.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; svgEl.style.cursor = ''; }
  });

  svgEl.addEventListener('dblclick', () => {
    userZoom = 1; userPanX = 0; userPanY = 0;
    redrawMap();
  });

  // Touch support
  let pinchDist0 = 0, pinchZoom0 = 1;
  svgEl.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchDist0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      pinchZoom0 = userZoom;
    }
  }, { passive: true });
  svgEl.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && fitMode === 'auto') {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (pinchDist0 > 0) {
        userZoom = Math.max(1, Math.min(8, pinchZoom0 * (d / pinchDist0)));
        redrawMap();
      }
    }
  }, { passive: true });
  svgEl.addEventListener('touchend', () => { pinchDist0 = 0; });
}

function resetMapZoom() {
  userZoom = 1; userPanX = 0; userPanY = 0;
  redrawMap();
}

async function buildMap() {
  worldData = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
  const { W, H } = getMapDims();
  projection = d3.geoNaturalEarth1();
  geoPath = d3.geoPath().projection(projection);
  mapSvg = d3.select('#map-svg');

  mapSvg.append('path').attr('class', 'sphere');
  mapSvg.append('path').attr('class', 'graticule');

  const countries = topojson.feature(worldData, worldData.objects.countries);

  // Resolve each polygon's region from the (now complete) COUNTRIES table.
  // Unknown countries stay untagged so they are never wrongly highlighted.
  function countryRegion(d) {
    const c = COUNTRIES[ISO_NUM_TO_A2[String(d.id)] || ''];
    if (!c) return { sr: '', ct: '' };
    return { sr: c.subregion || '', ct: c.continent || SUB_TO_CONT[c.subregion] || '' };
  }

  mapSvg.append('g').selectAll('path')
    .data(countries.features).join('path')
    .attr('class', 'country')
    .attr('data-subregion', d => countryRegion(d).sr)
    .attr('data-continent', d => countryRegion(d).ct);

  // Tag person dots with region data for filtering
  PERSONS.forEach(p => {
    p._subregion = p.region;
    p._continent = SUB_TO_CONT[p.region] || '';
  });

  const dotsG = mapSvg.append('g').attr('class', 'persons-layer');

  PERSONS.forEach(d => { d._baseOpacity = 0.85; });

  dotsG.selectAll('.person-dot')
    .data(PERSONS).join('circle')
    .attr('class', 'person-dot')
    .attr('r', d => dotR(d))
    .attr('fill', d => REGIONS[d.region].color)
    .attr('stroke', '#0d1117').attr('stroke-width', 1.5)
    .attr('opacity', 0.85)
    .on('mouseover', (evt, d) => showTooltip(evt, d))
    .on('mousemove', moveTip)
    .on('mouseout', hideTip)
    .on('click', (evt, d) => { evt.stopPropagation(); openDetail(d); });

  dotsG.selectAll('.person-label')
    .data(PERSONS.filter(d => d.rank <= 10)).join('text')
    .attr('class', 'person-label')
    .attr('pointer-events', 'none')
    .text(d => d.rank);

  mapSvg.on('click', closeDetail);

  redrawMap();

  // Domain filter buttons
  document.querySelectorAll('.filter-btn[data-filter="domain"]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeDomain = btn.dataset.value;
      document.querySelectorAll('.filter-btn[data-filter="domain"]')
        .forEach(b => b.classList.toggle('active', b === btn));
      applyAllFilters();
    });
  });

  // Fit buttons
  document.querySelectorAll('.fit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      fitMode = btn.dataset.mode;
      document.querySelectorAll('.fit-btn').forEach(b => b.classList.toggle('active', b === btn));
      resetMapZoom();
    });
  });

  // ResizeObserver
  new ResizeObserver(() => {
    userZoom = 1; userPanX = 0; userPanY = 0;
    redrawMap();
  }).observe(document.getElementById('map-container'));

  // Map zoom/pan interaction
  setupMapInteraction(document.getElementById('map-svg'));

  buildTimeline();
  initRegionFilter();
  document.getElementById('loading').style.display = 'none';
}

// ── Unified filter (domain + region) ───────────────────────
function applyAllFilters() {
  const domainMatch = d => activeDomain === 'all' || d.domain === activeDomain;
  const activeSubs = activeSubregions();
  const regionMatch = d => {
    if (!activeSubs) return true; // no region filter active
    return activeSubs.has(d._subregion) || activeSubs.has(d._continent);
  };

  d3.selectAll('.person-dot')
    .transition().duration(400)
    .attr('opacity', d => {
      if (activeRank && d.rank !== activeRank) return 0.25;
      return (domainMatch(d) && regionMatch(d)) ? 0.85 : 0.06;
    })
    .attr('pointer-events', d => (domainMatch(d) && regionMatch(d)) ? 'auto' : 'none');
  d3.selectAll('.tl-dot,.tl-bar')
    .transition().duration(400)
    .attr('opacity', d => {
      if (activeRank && d.rank !== activeRank) return 0.12;
      return (domainMatch(d) && regionMatch(d)) ? 0.9 : 0.04;
    })
    .attr('pointer-events', d => {
      if (activeRank && d.rank !== activeRank) return 'none';
      return (domainMatch(d) && regionMatch(d)) ? 'auto' : 'none';
    });
}

// ── Region map emphasis ────────────────────────────────────
// Default (un-highlighted) country style — matches the .country CSS.
const COUNTRY_BASE = { fill: '#1e2840', opacity: 1, stroke: '#2d3a52', strokeWidth: 0.4 };

function isCountryActive(el, activeSubs) {
  return activeSubs.has(el.dataset.subregion) || activeSubs.has(el.dataset.continent);
}

function applyRegionEmphasis() {
  const activeSubs = activeSubregions();
  const sel = d3.selectAll('.country').transition().duration(600);

  if (!activeSubs) {
    // No filter: every country back to its normal neutral style.
    sel.attr('fill', COUNTRY_BASE.fill)
       .attr('opacity', COUNTRY_BASE.opacity)
       .attr('stroke', COUNTRY_BASE.stroke)
       .attr('stroke-width', COUNTRY_BASE.strokeWidth);
  } else {
    // Selected regions get an elegant fill in their own color family;
    // everything else simply stays neutral (no harsh fade-out).
    sel.attr('fill', function() {
        if (!isCountryActive(this, activeSubs)) return COUNTRY_BASE.fill;
        return regionColor(this.dataset.subregion, this.dataset.continent);
      })
      .attr('opacity', function() {
        return isCountryActive(this, activeSubs) ? 0.5 : COUNTRY_BASE.opacity;
      })
      .attr('stroke', function() {
        if (!isCountryActive(this, activeSubs)) return COUNTRY_BASE.stroke;
        return regionColor(this.dataset.subregion, this.dataset.continent);
      })
      .attr('stroke-width', function() {
        return isCountryActive(this, activeSubs) ? 0.9 : COUNTRY_BASE.strokeWidth;
      });
  }

  // Also apply to person dots
  applyAllFilters();
}

// ═══════════════════════════════════════════════════════════
// TIMELINE
// ═══════════════════════════════════════════════════════════

function isLifelineMode(start, end) {
  return (end - start) <= LIFELINE_THRESHOLD;
}

// Greedy row assignment for lifeline bars
function assignRows(persons) {
  const sorted = [...persons].sort((a, b) => a.birth - b.birth);
  const rowEnd = [];
  return sorted.map(p => {
    let row = rowEnd.findIndex(e => e < p.birth - 3);
    if (row === -1) { row = rowEnd.length; rowEnd.push(p.death); }
    else rowEnd[row] = p.death;
    return { ...p, row };
  });
}

function buildTimeline() {
  // Era buttons
  document.querySelectorAll('.era-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const era = btn.dataset.era;
      const def = ERA_DEFS[era];
      tlState.era = era;
      tlState.start = def.start;
      tlState.end = def.end;
      document.querySelectorAll('.era-btn').forEach(b => b.classList.toggle('active', b === btn));
      const yr = document.getElementById('yr-range');
      yr.style.display = def.fineTune ? 'flex' : 'none';
      if (def.fineTune) {
        document.getElementById('yr-start').value = def.start;
        document.getElementById('yr-end').value = def.end;
      }
      renderTimeline();
    });
  });

  document.getElementById('yr-apply').addEventListener('click', () => {
    const s = parseInt(document.getElementById('yr-start').value, 10);
    const e = parseInt(document.getElementById('yr-end').value, 10);
    if (!isNaN(s) && !isNaN(e) && s < e) {
      tlState.start = s; tlState.end = e;
      renderTimeline();
    }
  });

  renderTimeline();
}

function renderTimeline() {
  const { start, end } = tlState;
  const lifeline = isLifelineMode(start, end);
  const inView = PERSONS.filter(p => p.death >= start && p.birth <= end);
  const wrap = document.getElementById('tl-svg-wrap');
  const tlEl = document.getElementById('timeline-svg');
  const W = tlEl.parentElement.clientWidth || window.innerWidth;

  document.getElementById('tl-mode-info').textContent =
    lifeline ? `生平线视图 · ${inView.length} 人` : `时间点视图 · ${inView.length} 人`;

  if (lifeline) {
    renderLifeline(inView, start, end, W);
  } else {
    renderDots(inView, start, end, W);
  }
}

// ── Dot mode ────────────────────────────────────────────────
function renderDots(persons, start, end, W) {
  const H = TL_HEIGHT_DOT;
  const tl = document.getElementById('timeline');
  tl.style.height = (36 + H) + 'px';
  const svg = d3.select('#timeline-svg').attr('height', H);
  svg.selectAll('*').remove();

  const xScale = d3.scaleLinear().domain([start, end]).range([48, W - 20]);

  // Era band backgrounds
  const eraSegs = [
    { s: -3200, e: -500,  c: '#251a08', lc: '#6b5020' },
    { s: -500,  e: 500,   c: '#081420', lc: '#3060a0' },
    { s: 500,   e: 1400,  c: '#141408', lc: '#606030' },
    { s: 1400,  e: 1800,  c: '#081414', lc: '#206060' },
    { s: 1800,  e: 2030,  c: '#081408', lc: '#306030' },
  ];
  const eraLabels = ['上古','古典','中世纪','近代','现代'];
  eraSegs.forEach((seg, i) => {
    const x1 = Math.max(xScale(seg.s), 48);
    const x2 = Math.min(xScale(seg.e), W - 20);
    if (x2 <= x1) return;
    svg.append('rect').attr('x', x1).attr('y', 0)
      .attr('width', x2 - x1).attr('height', H).attr('fill', seg.c);
    svg.append('text')
      .attr('x', (x1 + x2) / 2).attr('y', 13)
      .attr('text-anchor', 'middle')
      .attr('fill', seg.lc)
      .attr('font-size', '10px')
      .attr('font-weight', '600')
      .text(eraLabels[i]);
    // Separator line
    if (x1 > 48) {
      svg.append('line')
        .attr('x1', x1).attr('y1', 0).attr('x2', x1).attr('y2', H)
        .attr('stroke', seg.lc).attr('stroke-width', 0.5).attr('opacity', 0.4);
    }
  });

  // Axis
  const axisY = H - 18;
  svg.append('line')
    .attr('x1', 48).attr('y1', axisY).attr('x2', W - 20).attr('y2', axisY)
    .attr('stroke', '#3d4760').attr('stroke-width', 0.6);

  const range = end - start;
  const tickInterval = range > 4000 ? 1000 : range > 1500 ? 500 : range > 500 ? 200 : 100;
  const tickStart = Math.ceil(start / tickInterval) * tickInterval;
  for (let t = tickStart; t <= end; t += tickInterval) {
    const x = xScale(t);
    if (x < 52 || x > W - 24) continue;
    svg.append('line')
      .attr('x1', x).attr('y1', axisY - 4).attr('x2', x).attr('y2', axisY + 4)
      .attr('stroke', '#4a5570').attr('stroke-width', 0.8);
    svg.append('text')
      .attr('x', x).attr('y', H - 5)
      .attr('text-anchor', 'middle')
      .attr('fill', '#6a7a90')
      .attr('font-size', '9px')
      .text(t < 0 ? `BC${Math.abs(t)}` : t === 0 ? '公元0' : t);
  }

  // Row stacking
  const DOT_AREA_H = H - 28;
  const ROWS = 3;
  const rowH = DOT_AREA_H / ROWS;
  const colBuckets = {};
  const sorted = [...persons].sort((a, b) => a.birth - b.birth);
  sorted.forEach(d => {
    const xi = Math.round(xScale(d.birth) / 6);
    colBuckets[xi] = (colBuckets[xi] || 0);
    const row = colBuckets[xi] % ROWS;
    colBuckets[xi]++;
    d._tlx = xScale(d.birth);
    d._tly = 16 + row * rowH + rowH / 2;
  });

  svg.selectAll('.tl-dot').data(sorted).join('circle')
    .attr('class', 'tl-dot')
    .attr('cx', d => d._tlx).attr('cy', d => d._tly)
    .attr('r', 3.5)
    .attr('fill', d => REGIONS[d.region].color)
    .attr('opacity', 0.9)
    .on('mouseover', (evt, d) => showTooltip(evt, d))
    .on('mousemove', moveTip)
    .on('mouseout', hideTip)
    .on('click', (evt, d) => { evt.stopPropagation(); openDetail(d); });
}

// ── Lifeline mode ────────────────────────────────────────────
function renderLifeline(persons, start, end, W) {
  const withRows = assignRows(persons);
  const numRows = withRows.length ? Math.max(...withRows.map(d => d.row)) + 1 : 0;
  const svgH = TL_AXIS_H + numRows * TL_ROW_H + 10;
  const clampH = Math.min(svgH, TL_MAX_H);
  const tl = document.getElementById('timeline');
  tl.style.height = (36 + clampH) + 'px';

  d3.select('#timeline-svg').attr('height', svgH);
  const svg = d3.select('#timeline-svg');
  svg.selectAll('*').remove();

  const LEFT = 10, RIGHT = 20;
  const xScale = d3.scaleLinear().domain([start, end]).range([LEFT, W - RIGHT]);
  const topPad = 6;

  // Background
  svg.append('rect').attr('x', 0).attr('y', 0)
    .attr('width', W).attr('height', svgH)
    .attr('fill', '#0d1117');

  // Axis at top
  const axisY = topPad + 12;
  svg.append('line')
    .attr('x1', LEFT).attr('y1', axisY).attr('x2', W - RIGHT).attr('y2', axisY)
    .attr('stroke', '#3d4d60').attr('stroke-width', 0.8);

  const range = end - start;
  const tickInterval = range > 300 ? 100 : range > 100 ? 50 : 25;
  const tickStart = Math.ceil(start / tickInterval) * tickInterval;
  for (let t = tickStart; t <= end; t += tickInterval) {
    const x = xScale(t);
    if (x < LEFT || x > W - RIGHT) continue;
    svg.append('line')
      .attr('x1', x).attr('y1', axisY - 4).attr('x2', x).attr('y2', axisY + 4)
      .attr('stroke', '#3d4d60').attr('stroke-width', 0.7);
    // Show fewer labels to avoid crowding
    const skip = range > 300 ? 2 : 1;
    if (Math.round((t - tickStart) / tickInterval) % skip === 0) {
      svg.append('text')
        .attr('x', x).attr('y', axisY - 7)
        .attr('text-anchor', 'middle')
        .attr('fill', '#7a8a9e')
        .attr('font-size', '8.5px')
        .text(t < 0 ? `BC${Math.abs(t)}` : t);
    }
  }

  // Grid lines (faint vertical lines at century marks)
  for (let t = tickStart; t <= end; t += tickInterval) {
    const x = xScale(t);
    svg.append('line')
      .attr('x1', x).attr('y1', axisY + 5).attr('x2', x).attr('y2', svgH)
      .attr('stroke', '#1e2840').attr('stroke-width', 0.5);
  }

  // Lifeline bars
  const barH = 13;
  const barGroups = svg.selectAll('.tl-bar-g')
    .data(withRows).join('g').attr('class', 'tl-bar-g');

  withRows.forEach(d => {
    const rowY = topPad + TL_AXIS_H + d.row * TL_ROW_H;
    const barY = rowY + (TL_ROW_H - barH) / 2;
    const x1 = xScale(Math.max(d.birth, start));
    const x2 = xScale(Math.min(d.death, end));
    const barW = Math.max(x2 - x1, 2);
    const col = REGIONS[d.region].color;

    d._tlx = x1;
    d._tly = barY + barH / 2;
    d._barW = barW;
    d._barY = barY;

    // Row separator (subtle)
    if (d.row > 0) {
      svg.append('line')
        .attr('x1', LEFT).attr('y1', rowY - 1)
        .attr('x2', W - RIGHT).attr('y2', rowY - 1)
        .attr('stroke', '#191f2c').attr('stroke-width', 0.6);
    }
  });

  // Draw bars
  svg.selectAll('.tl-bar').data(withRows).join('rect')
    .attr('class', 'tl-bar')
    .attr('x', d => d._tlx)
    .attr('y', d => d._barY)
    .attr('width', d => d._barW)
    .attr('height', barH)
    .attr('rx', 2)
    .attr('fill', d => REGIONS[d.region].color)
    .attr('opacity', 0.75)
    .on('mouseover', (evt, d) => showTooltip(evt, d))
    .on('mousemove', moveTip)
    .on('mouseout', hideTip)
    .on('click', (evt, d) => { evt.stopPropagation(); openDetail(d); });

  // Birth tick marks
  withRows.forEach(d => {
    if (d.birth >= start) {
      const bx = xScale(d.birth);
      svg.append('line')
        .attr('x1', bx).attr('y1', d._barY - 1)
        .attr('x2', bx).attr('y2', d._barY + barH + 1)
        .attr('stroke', '#fff').attr('stroke-width', 1).attr('opacity', 0.4)
        .attr('pointer-events', 'none');
    }
  });

  // Name labels
  withRows.forEach(d => {
    const textX = d._tlx + 4;
    const textY = d._barY + barH / 2;
    const availW = d._barW - 6;

    if (d._barW >= 30) {
      svg.append('text')
        .attr('x', textX).attr('y', textY)
        .attr('dominant-baseline', 'middle')
        .attr('fill', '#0d1117')
        .attr('font-size', '9px')
        .attr('font-weight', '600')
        .attr('pointer-events', 'none')
        .attr('clip-path', `inset(0 0 0 0)`)
        .text(d.zh);
    } else {
      // Label outside bar, to the right
      if (d._tlx + d._barW + 2 < W - RIGHT - 20) {
        svg.append('text')
          .attr('x', d._tlx + d._barW + 3)
          .attr('y', textY)
          .attr('dominant-baseline', 'middle')
          .attr('fill', '#8b949e')
          .attr('font-size', '8.5px')
          .attr('pointer-events', 'none')
          .text(d.zh);
      }
    }
  });

  // Rank dots overlay (small rank number on wide bars)
  withRows.forEach(d => {
    if (d.rank <= 20 && d._barW >= 18) {
      svg.append('text')
        .attr('x', d._tlx + d._barW - 4)
        .attr('y', d._barY + barH / 2)
        .attr('dominant-baseline', 'middle')
        .attr('text-anchor', 'end')
        .attr('fill', '#0d1117')
        .attr('font-size', '8px')
        .attr('opacity', 0.7)
        .attr('pointer-events', 'none')
        .text(`#${d.rank}`);
    }
  });

  // Sync active state
  if (activeRank) {
    d3.selectAll('.tl-bar')
      .attr('opacity', d => d.rank === activeRank ? 1 : 0.15);
  }
}

  window._resizeTL = setTimeout(() => renderTimeline(), 150);
